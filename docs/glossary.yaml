# Готовые описания частых показателей — поле about для metrics/descriptions.yaml.
# Здесь только общее знание: что это и от чего зависит. Цифр и оценок владельца тут нет —
# assessment, status и as_of ассистент пишет сам по данным карты (docs/FORMATS.md, часть 3).
# Показателя здесь нет — напиши описание сам в том же духе: 1–2 фразы простым языком.

# ---------- Липиды и сердце ----------

- test: 'Аполипопротеин B (ApoB)'
  category: Липиды и сердце
  about: >-
    Белок, который есть на каждой «атерогенной» частице (ЛПНП, ЛПОНП, липопротеин(a)) — ровно по одной молекуле. По сути это счётчик частиц, способных откладываться в стенках сосудов; считается точнее расчётного ЛПНП.

- test: 'Гомоцистеин'
  category: Липиды и сердце
  about: >-
    Аминокислота — промежуточный продукт обмена. Растёт при нехватке витаминов B12, B6 и фолата; высокий уровень связывают с риском для сосудов.

- test: 'ЛПВП (HDL)'
  category: Липиды и сердце
  about: >-
    «Хороший» холестерин: частицы, которые уносят лишний холестерин из сосудов обратно в печень. Более высокий уровень обычно связан с меньшим риском для сердца.

- test: 'ЛПНП (LDL)'
  category: Липиды и сердце
  about: >-
    «Плохой» холестерин: сколько холестерина находится в частицах, которые несут его к тканям и могут откладываться в стенках сосудов. Значение обычно расчётное.

- test: 'ЛПОНП (VLDL)'
  category: Липиды и сердце
  about: >-
    Холестерин в частицах, которые несут из печени триглицериды. Расчётный показатель — обычно это триглицериды, делённые на пять.

- test: 'Липопротеин(a)'
  category: Липиды и сердце
  about: >-
    Особая разновидность частиц ЛПНП. Уровень задан генетически, почти не меняется в течение жизни и не зависит от питания. Высокий Lp(a) — самостоятельный фактор риска для сердца и сосудов.

- test: 'Не-ЛПВП холестерин'
  category: Липиды и сердце
  about: >-
    Весь холестерин, кроме «хорошего»: общий минус ЛПВП. Охватывает все атерогенные частицы и надёжен, даже если кровь сдана не натощак.

- test: 'С-реактивный белок (hs-CRP)'
  category: Липиды и сердце
  about: >-
    Высокочувствительный С-реактивный белок — маркер слабого хронического воспаления; его учитывают при оценке риска для сердца. Резко подскакивает при любой простуде или травме.

- test: 'Триглицериды'
  category: Липиды и сердце
  about: >-
    Жиры в крови — запас энергии, который разносится по телу. Сильно зависят от еды, сладкого и алкоголя накануне.

- test: 'Холестерин / ЛПВП'
  category: Липиды и сердце
  about: >-
    Отношение общего холестерина к «хорошему». Чем ниже, тем лучше.

- test: 'Холестерин общий'
  category: Липиды и сердце
  about: >-
    Сумма холестерина во всех частицах — и «плохих», и «хороших». Сам по себе мало что говорит: важно, из чего он складывается.

# ---------- Обмен веществ ----------

- test: 'Гликированный гемоглобин (HbA1c)'
  category: Обмен веществ
  about: >-
    Доля гемоглобина, «засахаренного» глюкозой. Показывает средний сахар за последние 2–3 месяца; основной тест на диабет и преддиабет.

- test: 'Глюкоза'
  category: Обмен веществ
  about: >-
    Сахар в крови на момент сдачи. Зависит от того, когда и что ели.

- test: 'Инсулин'
  category: Обмен веществ
  about: >-
    Гормон, который переносит глюкозу из крови в клетки. Высокий инсулин натощак — ранний признак того, что клетки хуже на него откликаются (инсулинорезистентность).

- test: 'Лептин'
  category: Обмен веществ
  about: >-
    Гормон жировой ткани — сигнал сытости для мозга. Его уровень примерно отражает количество жира в теле.

- test: 'Мочевая кислота'
  category: Обмен веществ
  about: >-
    Конечный продукт распада пуринов (мясо, морепродукты, пиво). Высокий уровень — риск подагры и камней в почках.

- test: 'С-пептид'
  category: Обмен веществ
  about: >-
    Образуется в поджелудочной железе вместе с инсулином, в равном количестве. Показывает, сколько собственного инсулина вырабатывает организм.

- test: 'Средняя глюкоза (eAG)'
  category: Обмен веществ
  about: >-
    Пересчёт HbA1c в привычные единицы глюкозы — «средний сахар» за 2–3 месяца. Расчётный показатель.

# ---------- Печень и белки ----------

- test: 'АЛТ'
  category: Печень и белки
  about: >-
    Фермент клеток печени. Попадает в кровь при их повреждении — от жира в печени, алкоголя, лекарств, вирусов.

- test: 'АСТ'
  category: Печень и белки
  about: >-
    Фермент печени и мышц. Может подниматься после тяжёлой тренировки, поэтому его смотрят вместе с АЛТ.

- test: 'Альбумин'
  category: Печень и белки
  about: >-
    Главный белок крови, вырабатывается печенью. Удерживает жидкость в сосудах и переносит гормоны и лекарства.

- test: 'Альбумин / глобулин'
  category: Печень и белки
  about: >-
    Отношение двух главных групп белков крови. Меняется при болезнях печени, почек и хроническом воспалении.

- test: 'Билирубин непрямой'
  category: Печень и белки
  about: >-
    Билирубин до обработки печенью (свободный); обычно это расчёт: общий минус прямой. Растёт при усиленном распаде эритроцитов и при безобидном синдроме Жильбера.

- test: 'Билирубин общий'
  category: Печень и белки
  about: >-
    Жёлтый пигмент, который образуется при распаде эритроцитов и выводится печенью с желчью.

- test: 'Билирубин прямой'
  category: Печень и белки
  about: >-
    Билирубин, уже обработанный печенью (связанный). Растёт, когда нарушен отток желчи или страдают клетки печени.

- test: 'ГГТ'
  category: Печень и белки
  about: >-
    Фермент желчных путей и печени, чувствителен к алкоголю. Помогает понять, откуда взялась повышенная щелочная фосфатаза — из печени или из костей.

- test: 'Глобулин'
  category: Печень и белки
  about: >-
    Группа белков крови, в которую входят антитела. Расчётный показатель: общий белок минус альбумин.

- test: 'ЛДГ'
  category: Печень и белки
  about: >-
    Лактатдегидрогеназа — фермент, который есть почти во всех клетках. Повышается при повреждении тканей: мышц, печени, сердца, при распаде эритроцитов; показатель неспецифический.

- test: 'Общий белок'
  category: Печень и белки
  about: >-
    Сумма всех белков крови — альбумина и глобулинов. Отражает питание, работу печени и почек.

- test: 'Щелочная фосфатаза (ALP)'
  category: Печень и белки
  about: >-
    Фермент костей и желчных путей. Повышается при активной перестройке кости, нехватке витамина D, застое желчи.

# ---------- Почки ----------

- test: 'BUN / креатинин'
  category: Почки
  about: >-
    Отношение мочевины к креатинину. Помогает отличить обезвоживание от собственно проблем с почками.

- test: 'Альбумин в моче'
  category: Почки
  about: >-
    Белок альбумин в моче — ранний признак повреждения почечного фильтра, например при диабете или гипертонии.

- test: 'Креатинин'
  category: Почки
  about: >-
    Продукт работы мышц, выводится почками; по нему считают скорость фильтрации. Выше при большой мышечной массе, после нагрузки, мяса и при нехватке воды.

- test: 'Мочевина (BUN)'
  category: Почки
  about: >-
    Продукт распада белка, выводится почками. Зависит от количества белка в еде и от того, сколько выпито воды.

- test: 'СКФ (eGFR)'
  category: Почки
  about: >-
    Расчётная скорость клубочковой фильтрации — главный показатель работы почек. Считается по креатинину, возрасту и полу.

- test: 'Цистатин C'
  category: Почки
  about: >-
    Белок, который вырабатывают все клетки, а выводят почки. Позволяет оценить работу почек независимо от мышечной массы — в отличие от креатинина.

# ---------- Электролиты и минералы ----------

- test: 'Анионный интервал'
  category: Электролиты и минералы
  about: >-
    Расчётный показатель баланса заряженных частиц в крови (натрий минус хлор и бикарбонат). Нужен при подозрении на нарушения кислотности крови.

- test: 'Бикарбонат (CO2)'
  category: Электролиты и минералы
  about: >-
    Главный буфер крови — поддерживает кислотно-щелочное равновесие.

- test: 'Калий'
  category: Электролиты и минералы
  about: >-
    Электролит, от которого зависит работа сердца, нервов и мышц.

- test: 'Кальций'
  category: Электролиты и минералы
  about: >-
    Минерал костей; в крови нужен для сокращения мышц и свёртывания. Его уровень регулируют паратгормон и витамин D.

- test: 'Кальций ионизированный'
  category: Электролиты и минералы
  about: >-
    Свободный, «рабочий» кальций — не связанный с белками. Точнее общего кальция, когда изменён уровень альбумина.

- test: 'Магний'
  category: Электролиты и минералы
  about: >-
    Магний в сыворотке крови. Участвует в работе мышц, нервов и сердца; в крови находится лишь малая его часть, поэтому нормальный результат не исключает небольшого дефицита.

- test: 'Магний в эритроцитах'
  category: Электролиты и минералы
  about: >-
    Магний внутри клеток крови. Точнее отражает запасы магния в организме, чем обычный магний в сыворотке.

- test: 'Натрий'
  category: Электролиты и минералы
  about: >-
    Главный электролит крови: удерживает воду и поддерживает давление. Низкий натрий чаще связан с избытком воды, чем с нехваткой соли.

- test: 'Фосфор'
  category: Электролиты и минералы
  about: >-
    Минерал костей и энергетического обмена. Его уровень регулируют почки, паратгормон и витамин D.

- test: 'Хлор'
  category: Электролиты и минералы
  about: >-
    Электролит, который «ходит» вместе с натрием и участвует в кислотно-щелочном равновесии.

- test: 'Цинк'
  category: Электролиты и минералы
  about: >-
    Микроэлемент для иммунитета, заживления и обмена гормонов.

# ---------- Общий анализ крови ----------

- test: 'Гематокрит'
  category: Общий анализ крови
  about: >-
    Доля объёма крови, которую занимают эритроциты. Растёт при обезвоживании, падает при анемии.

- test: 'Гемоглобин'
  category: Общий анализ крови
  about: >-
    Белок эритроцитов, который переносит кислород. Низкий гемоглобин — анемия; её частая причина — нехватка железа или скрытая потеря крови.

- test: 'Лейкоциты (WBC)'
  category: Общий анализ крови
  about: >-
    Белые клетки крови — иммунная защита. Растут при инфекции, воспалении, стрессе; падают при некоторых вирусных инфекциях.

- test: 'Ретикулоциты'
  category: Общий анализ крови
  about: >-
    Молодые эритроциты, только что вышедшие из костного мозга. Показывают, насколько активно он производит новые клетки, — например при анемии или на фоне её лечения.

- test: 'СОЭ'
  category: Общий анализ крови
  about: >-
    Скорость оседания эритроцитов. Неспецифический признак воспаления: растёт при инфекциях и воспалительных болезнях, но причину сама не называет.

- test: 'Среднее содержание Hb в эритроците (MCH)'
  category: Общий анализ крови
  about: >-
    Сколько гемоглобина в среднем в одном эритроците. Помогает определить вид анемии, если она есть.

- test: 'Средний объём тромбоцита (MPV)'
  category: Общий анализ крови
  about: >-
    Средний размер тромбоцитов. Молодые тромбоциты крупнее, поэтому показатель косвенно говорит о том, как быстро они обновляются.

- test: 'Средний объём эритроцита (MCV)'
  category: Общий анализ крови
  about: >-
    Средний размер эритроцита. Увеличивается при нехватке B12 и фолата и при регулярном алкоголе, уменьшается при нехватке железа.

- test: 'Средняя концентрация Hb в эритроците (MCHC)'
  category: Общий анализ крови
  about: >-
    Насколько плотно эритроциты заполнены гемоглобином.

- test: 'Тромбоциты'
  category: Общий анализ крови
  about: >-
    Клетки, отвечающие за свёртывание крови. Мало — риск кровотечений, много — бывает при воспалении и нехватке железа.

- test: 'Ширина распределения эритроцитов (RDW)'
  category: Общий анализ крови
  about: >-
    Насколько эритроциты различаются по размеру. Высокий RDW — ранний признак нехватки железа, B12 или фолата.

- test: 'Эритроциты (RBC)'
  category: Общий анализ крови
  about: >-
    Число красных клеток крови, которые переносят кислород.

# ---------- Лейкоцитарная формула ----------

- test: 'Базофилы %'
  category: Лейкоцитарная формула
  about: >-
    Доля базофилов среди всех лейкоцитов.

- test: 'Базофилы (абс.)'
  category: Лейкоцитарная формула
  about: >-
    Самые редкие лейкоциты. Участвуют в аллергических реакциях.

- test: 'Лимфоциты %'
  category: Лейкоцитарная формула
  about: >-
    Доля лимфоцитов среди всех лейкоцитов.

- test: 'Лимфоциты (абс.)'
  category: Лейкоцитарная формула
  about: >-
    Клетки иммунной памяти: защита от вирусов и выработка антител.

- test: 'Моноциты %'
  category: Лейкоцитарная формула
  about: >-
    Доля моноцитов среди всех лейкоцитов.

- test: 'Моноциты (абс.)'
  category: Лейкоцитарная формула
  about: >-
    Клетки-«уборщики»: поглощают микробы и остатки разрушенных клеток.

- test: 'Нейтрофилы %'
  category: Лейкоцитарная формула
  about: >-
    Доля нейтрофилов среди всех лейкоцитов.

- test: 'Нейтрофилы (абс.)'
  category: Лейкоцитарная формула
  about: >-
    Самые многочисленные лейкоциты — первая линия защиты от бактерий.

- test: 'Эозинофилы %'
  category: Лейкоцитарная формула
  about: >-
    Доля эозинофилов среди всех лейкоцитов.

- test: 'Эозинофилы (абс.)'
  category: Лейкоцитарная формула
  about: >-
    Лейкоциты, которые реагируют на аллергены и паразитов.

# ---------- Витамины и нутриенты ----------

- test: 'Арахидоновая / EPA'
  category: Витамины и нутриенты
  about: >-
    Отношение омега-6 кислоты, из которой образуются «провоспалительные» вещества, к омега-3 кислоте EPA с обратным действием. Чем ниже, тем лучше.

- test: 'Витамин B12'
  category: Витамины и нутриенты
  about: >-
    Нужен для кроветворения и нервной системы; поступает только с животной пищей. Запасы в печени большие, поэтому дефицит развивается медленно — чаще при вегетарианстве и проблемах с усвоением.

- test: 'Витамин D (25-OH)'
  category: Витамины и нутриенты
  about: >-
    Запасная форма витамина D в крови. Нужен костям, мышцам и иммунитету; от него зависят кальций и паратгормон.

- test: 'Железо'
  category: Витамины и нутриенты
  about: >-
    Железо в сыворотке на момент сдачи. Сильно колеблется в течение дня и после еды, поэтому один замер мало что значит.

- test: 'Метилмалоновая кислота (B12)'
  category: Витамины и нутриенты
  about: >-
    Вещество, которое накапливается, когда клеткам не хватает витамина B12. Самый чувствительный тест на его дефицит — точнее, чем сам B12 в крови.

- test: 'Насыщение трансферрина железом'
  category: Витамины и нутриенты
  about: >-
    Какая доля транспортного белка трансферрина занята железом. Временно растёт после еды и добавок с железом; стойко высокое значение — признак склонности накапливать железо.

- test: 'ОЖСС (TIBC)'
  category: Витамины и нутриенты
  about: >-
    Общая железосвязывающая способность: сколько железа кровь способна перенести. Отражает количество трансферрина.

- test: 'Омега-3 индекс'
  category: Витамины и нутриенты
  about: >-
    Сумма омега-3 кислот (EPA, DPA и DHA) в крови — в процентах от всех жирных кислот. Показывает, сколько омега-3 поступало с едой и добавками за последние месяцы.

- test: 'Омега-3: DHA'
  category: Витамины и нутриенты
  about: >-
    Докозагексаеновая кислота — омега-3 из рыбы и водорослей; основной структурный жир мозга и сетчатки.

- test: 'Омега-3: DPA'
  category: Витамины и нутриенты
  about: >-
    Докозапентаеновая кислота — промежуточная омега-3 между EPA и DHA.

- test: 'Омега-3: EPA'
  category: Витамины и нутриенты
  about: >-
    Эйкозапентаеновая кислота — омега-3 из жирной рыбы; из неё образуются вещества, сдерживающие воспаление.

- test: 'Омега-6 / омега-3'
  category: Витамины и нутриенты
  about: >-
    Соотношение омега-6 и омега-3 кислот в крови. В современном питании омега-6 обычно в избытке; чем ниже отношение, тем лучше.

- test: 'Омега-6 всего'
  category: Витамины и нутриенты
  about: >-
    Сумма омега-6 кислот в крови. Их источник — растительные масла, орехи, мясо.

- test: 'Омега-6: арахидоновая'
  category: Витамины и нутриенты
  about: >-
    Омега-6 кислота из мяса и яиц; из неё образуются вещества, запускающие воспаление и свёртывание.

- test: 'Омега-6: линолевая'
  category: Витамины и нутриенты
  about: >-
    Основная омега-6 кислота питания — из растительных масел, орехов и семян.

- test: 'Трансферрин'
  category: Витамины и нутриенты
  about: >-
    Белок-переносчик железа в крови. При нехватке железа его становится больше, при воспалении — меньше.

- test: 'Ферритин'
  category: Витамины и нутриенты
  about: >-
    Белок-хранилище железа: показывает его запасы в организме. Повышается также при воспалении.

- test: 'Фолиевая кислота'
  category: Витамины и нутриенты
  about: >-
    Витамин B9: нужен для деления клеток и кроветворения; особенно важен при планировании беременности. Много в зелени и бобовых.

# ---------- Гормоны ----------

- test: 'ГСПГ (SHBG)'
  category: Гормоны
  about: >-
    Глобулин, связывающий половые гормоны. Чем его больше, тем меньше тестостерона остаётся свободным и активным.

- test: 'ДГЭА-С'
  category: Гормоны
  about: >-
    Гормон надпочечников — предшественник половых гормонов. С возрастом постепенно снижается.

- test: 'Кортизол'
  category: Гормоны
  about: >-
    Гормон стресса и бодрствования. Максимален утром и падает к вечеру, поэтому важно время сдачи.

- test: 'ЛГ'
  category: Гормоны
  about: >-
    Лютеинизирующий гормон гипофиза. У женщин запускает овуляцию и зависит от дня цикла, у мужчин даёт команду вырабатывать тестостерон.

- test: 'Паратгормон (PTH)'
  category: Гормоны
  about: >-
    Гормон околощитовидных желёз: поднимает кальций в крови. Часто растёт при нехватке витамина D.

- test: 'Пролактин'
  category: Гормоны
  about: >-
    Гормон гипофиза, отвечает за лактацию. Вне беременности и кормления высокий пролактин может сбивать цикл у женщин и снижать либидо у мужчин.

- test: 'Тестостерон общий'
  category: Гормоны
  about: >-
    Половой гормон: либидо, мышцы, кости, энергия. У мужчин — главный половой гормон, у женщин вырабатывается в небольшом количестве. Максимален утром.

- test: 'Тестостерон свободный'
  category: Гормоны
  about: >-
    Та часть тестостерона, которая не связана с белками и доступна тканям, — 1–3 % от общего.

- test: 'ФСГ'
  category: Гормоны
  about: >-
    Фолликулостимулирующий гормон гипофиза. У женщин управляет созреванием фолликулов — зависит от дня цикла и растёт в менопаузе; у мужчин управляет выработкой сперматозоидов.

- test: 'Эстрадиол'
  category: Гормоны
  about: >-
    Основной женский половой гормон; уровень сильно зависит от дня цикла. У мужчин в небольшом количестве образуется из тестостерона.

# ---------- Щитовидная железа ----------

- test: 'Антитела к ТПО'
  category: Щитовидная железа
  about: >-
    Антитела против фермента щитовидной железы. Их наличие — признак аутоиммунного тиреоидита.

- test: 'Антитела к тиреоглобулину'
  category: Щитовидная железа
  about: >-
    Антитела против белка щитовидной железы — второй маркер аутоиммунного поражения железы.

- test: 'Т3 общий'
  category: Щитовидная железа
  about: >-
    Весь трийодтиронин в крови — связанный с белками и свободный. Помогает при подозрении на избыток гормонов щитовидной железы.

- test: 'Т3 свободный'
  category: Щитовидная железа
  about: >-
    Активный гормон щитовидной железы — задаёт скорость обмена веществ.

- test: 'Т4 общий'
  category: Щитовидная железа
  about: >-
    Весь тироксин в крови — и связанный с белками, и свободный. Зависит от уровня белков-переносчиков, поэтому чаще смотрят свободный Т4.

- test: 'Т4 свободный'
  category: Щитовидная железа
  about: >-
    Основной гормон, который вырабатывает щитовидная железа; из него в тканях образуется активный Т3.

- test: 'ТТГ'
  category: Щитовидная железа
  about: >-
    Гормон гипофиза, который управляет щитовидной железой, — первый тест при её проверке. Высокий ТТГ — железа работает слабо, низкий — слишком активно.

# ---------- Простата ----------

- test: 'ПСА общий'
  category: Простата
  about: >-
    Простат-специфический антиген — белок, который вырабатывает простата (анализ для мужчин). Растёт при её воспалении, увеличении и при раке простаты.

- test: 'ПСА свободный'
  category: Простата
  about: >-
    Часть ПСА, не связанная с белками крови. Нужна, чтобы посчитать долю свободного ПСА.

- test: 'ПСА свободный %'
  category: Простата
  about: >-
    Доля свободного ПСА в общем. Имеет смысл при повышенном общем ПСА: чем доля выше, тем спокойнее.

# ---------- Женское здоровье ----------

- test: 'Антимюллеров гормон (AMH)'
  category: Женское здоровье
  about: >-
    Вырабатывается фолликулами яичников и отражает их запас (овариальный резерв). Почти не зависит от дня цикла.

- test: 'Прогестерон'
  category: Женское здоровье
  about: >-
    Гормон второй половины цикла и беременности. Уровень сильно зависит от дня цикла: по нему судят, была ли овуляция.

- test: 'ХГЧ'
  category: Женское здоровье
  about: >-
    Гормон беременности: появляется в крови вскоре после зачатия и быстро растёт в первые недели.

# ---------- Поджелудочная ----------

- test: 'Амилаза'
  category: Поджелудочная
  about: >-
    Фермент поджелудочной и слюнных желёз, расщепляет крахмал. Растёт при воспалении поджелудочной железы.

- test: 'Липаза'
  category: Поджелудочная
  about: >-
    Фермент поджелудочной железы, расщепляет жиры. Более специфичный маркер её воспаления, чем амилаза.

# ---------- Иммунитет и инфекции ----------

- test: 'Антинуклеарные антитела (ANA)'
  category: Иммунитет и инфекции
  about: >-
    Антитела к ядрам собственных клеток — скрининг аутоиммунных болезней вроде волчанки.

- test: 'Антитела к гепатиту B (anti-HBs)'
  category: Иммунитет и инфекции
  about: >-
    Защитные антитела к вирусу гепатита B. Появляются после прививки или перенесённой инфекции; показывают, есть ли иммунитет.

- test: 'ВИЧ 1/2'
  category: Иммунитет и инфекции
  about: >-
    Тест четвёртого поколения: ищет и антитела к ВИЧ, и антиген самого вируса.

- test: 'Гепатит B (HBsAg)'
  category: Иммунитет и инфекции
  about: >-
    Поверхностный антиген вируса гепатита B — белок самого вируса. Положительный результат означает текущую инфекцию.

- test: 'Гепатит C (антитела)'
  category: Иммунитет и инфекции
  about: >-
    Антитела к вирусу гепатита C. Разовый скрининг, который рекомендуют всем взрослым.

- test: 'Герпес 1 типа (антитела)'
  category: Иммунитет и инфекции
  about: >-
    Антитела IgG к вирусу простого герпеса 1 типа («простуда на губах»). Показывают, что контакт с вирусом когда-то был; остаются на всю жизнь.

- test: 'Герпес 2 типа (антитела)'
  category: Иммунитет и инфекции
  about: >-
    Антитела IgG к вирусу простого герпеса 2 типа — он чаще вызывает генитальный герпес.

- test: 'Гонорея'
  category: Иммунитет и инфекции
  about: >-
    Тест на ДНК возбудителя гонореи — инфекции, передающейся половым путём.

- test: 'Иммуноглобулин E общий (IgE)'
  category: Иммунитет и инфекции
  about: >-
    Антитела, участвующие в аллергических реакциях. Повышается при аллергии и паразитарных инфекциях, но на конкретный аллерген не указывает.

- test: 'Ревматоидный фактор'
  category: Иммунитет и инфекции
  about: >-
    Антитела, которые часто встречаются при ревматоидном артрите и некоторых других аутоиммунных болезнях.

- test: 'Сифилис (RPR)'
  category: Иммунитет и инфекции
  about: >-
    Скрининговый тест на сифилис.

- test: 'Трихомонада'
  category: Иммунитет и инфекции
  about: >-
    Тест на трихомонаду — простейшее, которое передаётся половым путём.

- test: 'Хламидии'
  category: Иммунитет и инфекции
  about: >-
    Тест на ДНК хламидии — частой инфекции, передающейся половым путём; часто протекает без симптомов.

# ---------- Токсины ----------

- test: 'Ртуть'
  category: Токсины
  about: >-
    Ртуть в крови. Основной источник — крупная морская рыба: тунец, рыба-меч, королевская макрель.

- test: 'Свинец'
  category: Токсины
  about: >-
    Свинец в крови. Источники — старая краска и трубы, некоторые производства и хобби.

# ---------- Моча ----------

- test: 'Моча: pH'
  category: Моча
  about: >-
    Кислотность мочи. Зависит от питания: мясо делает её кислее, овощи — щелочнее.

- test: 'Моча: бактерии'
  category: Моча
  about: >-
    Бактерии в осадке мочи под микроскопом. Единичные часто попадают при сборе и сами по себе не означают инфекцию.

- test: 'Моча: белок'
  category: Моча
  about: >-
    Белок в моче — признак повреждения почечного фильтра. Временно появляется после тяжёлой нагрузки.

- test: 'Моча: билирубин'
  category: Моча
  about: >-
    Билирубин в моче появляется при болезнях печени и застое желчи.

- test: 'Моча: гиалиновые цилиндры'
  category: Моча
  about: >-
    «Слепки» почечных канальцев из белка. Единичные бывают после нагрузки и при нехватке воды.

- test: 'Моча: глюкоза'
  category: Моча
  about: >-
    Сахар в моче появляется, когда его слишком много в крови, — признак диабета.

- test: 'Моча: дрожжи'
  category: Моча
  about: >-
    Дрожжевые грибки в осадке мочи — признак грибковой инфекции или загрязнения пробы.

- test: 'Моча: дрожжи (гифы)'
  category: Моча
  about: >-
    Нитевидная форма дрожжевых грибков — признак их активного роста.

- test: 'Моча: кетоны'
  category: Моча
  about: >-
    Продукты распада жира. Появляются при голодании, низкоуглеводной диете и при некомпенсированном диабете.

- test: 'Моча: кровь'
  category: Моча
  about: >-
    Тест-полоска на гемоглобин: ловит скрытую кровь в моче — при камнях, воспалении, болезнях почек и мочевого пузыря.

- test: 'Моча: лейкоцитарная эстераза'
  category: Моча
  about: >-
    Фермент лейкоцитов. Положительный результат — признак воспаления в мочевых путях.

- test: 'Моча: лейкоциты'
  category: Моча
  about: >-
    Лейкоциты в осадке мочи под микроскопом. Много — признак инфекции или воспаления.

- test: 'Моча: нитриты'
  category: Моча
  about: >-
    Нитриты образуют бактерии. Положительный результат — признак инфекции мочевых путей.

- test: 'Моча: плоский эпителий'
  category: Моча
  about: >-
    Клетки с поверхности мочеиспускательного канала и кожи. Если их много — проба загрязнена при сборе.

- test: 'Моча: прозрачность'
  category: Моча
  about: >-
    Внешний вид мочи. Мутная бывает при инфекции, солях или примеси слизи.

- test: 'Моча: скопления лейкоцитов'
  category: Моча
  about: >-
    Слипшиеся группы лейкоцитов в осадке мочи — признак выраженного воспаления.

- test: 'Моча: удельный вес'
  category: Моча
  about: >-
    Плотность мочи: показывает, насколько она концентрирована, — по сути, сколько воды было выпито.

- test: 'Моча: уробилиноген'
  category: Моча
  about: >-
    Продукт превращения билирубина в кишечнике. Повышается при болезнях печени и усиленном распаде эритроцитов.

- test: 'Моча: цвет'
  category: Моча
  about: >-
    Цвет мочи. Зависит в основном от того, сколько выпито воды; его меняют также еда, витамины и лекарства.

- test: 'Моча: эритроциты'
  category: Моча
  about: >-
    Эритроциты в осадке мочи под микроскопом. Много — повод искать источник крови в мочевых путях.

# ---------- Замеры ----------

- test: 'АД диастолическое'
  category: Замеры
  about: >-
    «Нижнее» давление — в сосудах в момент, когда сердце расслабляется между ударами.

- test: 'АД систолическое'
  category: Замеры
  about: >-
    «Верхнее» давление — в сосудах в момент сокращения сердца.

- test: 'Вес'
  category: Замеры
  about: >-
    Масса тела. На приёмах измеряется в одежде, дома — обычно утром натощак, поэтому цифры немного различаются.

- test: 'ИМТ'
  category: Замеры
  about: >-
    Индекс массы тела: вес в килограммах, делённый на квадрат роста в метрах. Грубая оценка — не отличает мышцы от жира.

- test: 'Окружность талии'
  category: Замеры
  about: >-
    Обхват талии на уровне пупка. Показывает, сколько жира в области живота: он сильнее связан с риском для сердца и обмена веществ, чем вес сам по себе.

- test: 'Пульс'
  category: Замеры
  about: >-
    Частота сердечных сокращений в покое на приёме. В кабинете врача пульс обычно выше, чем дома.

- test: 'Рост'
  category: Замеры
  about: >-
    Рост, измеренный на приёме. Нужен для расчёта ИМТ.

- test: 'Сатурация (SpO2)'
  category: Замеры
  about: >-
    Насыщение крови кислородом — измеряется датчиком на пальце.

- test: 'Температура'
  category: Замеры
  about: >-
    Температура тела. Немного меняется в течение дня: утром ниже, к вечеру выше.

# ---------- Прочее ----------

- test: 'Группа крови (ABO)'
  category: Прочее
  about: >-
    Группа крови по системе ABO. Не меняется в течение жизни; важна при переливании крови.

- test: 'Резус-фактор'
  category: Прочее
  about: >-
    Белок на поверхности эритроцитов. Не меняется в течение жизни; важен при переливании крови.
