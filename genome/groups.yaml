# Гены и темы, которые мы умеем читать в геноме, — общие знания, без чьих-либо данных.
# Сайт показывает их на странице «Геном»; маркеры каждой группы лежат в panel.csv.
#
#   group      ключ группы — тот же, что в panel.csv и в genome/notes.yaml карты
#   section    раздел на странице; разделы идут в том порядке, в каком впервые встречаются здесь
#   title      заголовок
#   about      что это за ген и почему он важен — 1–3 фразы простым языком
#   drugs      (раздел «Лекарства») каких лекарств касается
#   sensitive  true — тема, которую сайт не показывает, пока владелец сам не откроет:
#              болезни без профилактики, наследственный рак, носительство
#
# Правила — docs/GENOME.md.

# ---------- Лекарства ----------

- group: CYP2C19
  section: Лекарства
  title: CYP2C19
  about: >-
    Фермент печени, который активирует клопидогрел и разрушает многие другие лекарства. Нерабочие варианты есть
    у каждого третьего-четвёртого человека: клопидогрел тогда действует слабее, а лекарства, которые фермент
    разрушает, держатся в крови дольше.
  drugs: клопидогрел; омепразол, пантопразол и другие средства от изжоги; сертралин, циталопрам, эсциталопрам; вориконазол

- group: CYP2C9
  section: Лекарства
  title: CYP2C9
  about: >-
    Фермент печени, который выводит варфарин и многие обезболивающие. При сниженных вариантах эти лекарства
    накапливаются — нужны меньшие дозы.
  drugs: варфарин; ибупрофен, целекоксиб, мелоксикам и другие обезболивающие; фенитоин; флувастатин

- group: CYP2D6
  section: Лекарства
  title: CYP2D6 — результат всегда неполный
  about: >-
    Один из главных ферментов, разрушающих лекарства: через него проходят кодеин и трамадол, многие антидепрессанты
    и нейролептики, метопролол, тамоксифен. ДНК-тест видит лишь часть вариантов гена и совсем не видит числа его
    копий — а ген бывает удалён или удвоен. Поэтому по такому тесту можно исключить отдельные варианты,
    но нельзя определить тип метаболизма: для этого нужен клинический тест.
  drugs: кодеин, трамадол; амитриптилин, пароксетин и другие антидепрессанты; метопролол; тамоксифен; ондансетрон

- group: VKORC1
  section: Лекарства
  title: VKORC1 и CYP4F2 — доза варфарина
  about: >-
    VKORC1 — мишень варфарина, CYP4F2 участвует в обмене витамина K. Вместе с CYP2C9 они объясняют, почему
    одним людям нужна в несколько раз меньшая доза варфарина, чем другим.
  drugs: варфарин

- group: SLCO1B1
  section: Лекарства
  title: SLCO1B1 — статины
  about: >-
    Белок, который переносит статины из крови в печень. При сниженном варианте статина в крови больше,
    и выше риск мышечных болей и повреждения мышц — сильнее всего это касается симвастатина.
  drugs: симвастатин, аторвастатин, розувастатин и другие статины

- group: CYP3A5
  section: Лекарства
  title: CYP3A5
  about: >-
    Фермент, который у большинства европейцев «выключен» с рождения. У тех, у кого он работает, некоторые
    лекарства разрушаются быстрее — важнее всего это для такролимуса после трансплантации.
  drugs: такролимус

- group: CYP3A4
  section: Лекарства
  title: CYP3A4*22
  about: >-
    CYP3A4 — главный фермент, разрушающий лекарства: через него проходит примерно половина всех препаратов.
    Вариант *22 снижает его работу.
  drugs: такролимус; ряд статинов, снотворных и противоопухолевых препаратов

- group: CYP2B6
  section: Лекарства
  title: CYP2B6
  about: >-
    Фермент печени, который разрушает эфавиренз, метадон и бупропион. При сниженных вариантах их уровень
    в крови выше.
  drugs: эфавиренз; метадон; бупропион

- group: TPMT
  section: Лекарства
  title: TPMT и NUDT15 — тиопурины
  about: >-
    Два фермента, которые обезвреживают тиопурины — лекарства для подавления иммунитета и лечения лейкозов.
    Без них обычная доза вызывает тяжёлое угнетение кроветворения, поэтому перед лечением гены проверяют.
  drugs: азатиоприн, меркаптопурин, тиогуанин

- group: DPYD
  section: Лекарства
  title: DPYD — фторпиримидины
  about: >-
    Фермент, который разрушает фторурацил и капецитабин — частые препараты химиотерапии. При нерабочих вариантах
    обычная доза может быть смертельно токсичной, поэтому перед лечением ген проверяют клиническим тестом.
  drugs: фторурацил, капецитабин

- group: NAT2
  section: Лекарства
  title: NAT2 — быстрые и медленные ацетиляторы
  about: >-
    Фермент печени, который обезвреживает ряд лекарств. Примерно половина европейцев — «медленные ацетиляторы»:
    у них эти лекарства выводятся дольше и чаще дают побочные эффекты.
  drugs: изониазид; гидралазин; сульфасалазин и некоторые сульфаниламиды

- group: HLA-B5701
  section: Лекарства
  title: HLA-B*57:01 — абакавир
  about: >-
    Вариант гена иммунной системы, при котором абакавир (лекарство от ВИЧ) вызывает тяжёлую аллергическую реакцию.
    Чип видит не сам вариант, а соседний маркер-метку; перед назначением всегда делают клинический тест.
  drugs: абакавир

- group: G6PD
  section: Лекарства
  title: G6PD — дефицит глюкозо-6-фосфатдегидрогеназы
  about: >-
    Фермент, который защищает эритроциты от окисления. При дефиците некоторые лекарства и конские бобы вызывают
    распад эритроцитов. Ген лежит на X-хромосоме, поэтому у мужчин достаточно одной копии варианта.
  drugs: примахин, расбуриказа, дапсон, нитрофурантоин

- group: XPNPEP2
  section: Лекарства
  title: XPNPEP2 — ингибиторы АПФ
  about: >-
    Фермент, который разрушает брадикинин. Вариант, снижающий его работу, в нескольких исследованиях связывали
    с отёком Квинке от ингибиторов АПФ. Данные предварительные, в рекомендации не входит.
  drugs: лизиноприл, эналаприл и другие ингибиторы АПФ

# ---------- Железо ----------

- group: HFE
  section: Железо
  title: HFE — наследственный гемохроматоз
  about: >-
    Ген регулирует всасывание железа. Две копии варианта C282Y (реже C282Y вместе с H63D) — самая частая причина
    наследственного гемохроматоза: железо годами накапливается в печени, сердце и суставах. Одна копия —
    носительство, обычно без последствий.

- group: TMPRSS6
  section: Железо
  title: TMPRSS6 — уровень железа
  about: >-
    Ген управляет гепсидином — гормоном, который ограничивает всасывание железа. Частый вариант немного сдвигает
    железо, насыщение трансферрина и гемоглобин.

- group: TF
  section: Железо
  title: TF — трансферрин
  about: >-
    Ген самого транспортного белка железа. Частые варианты немного меняют его количество (ОЖСС),
    а значит и долю, занятую железом.

# ---------- Липиды и сердце ----------

- group: LPA
  section: Липиды и сердце
  title: LPA — липопротеин(a)
  about: >-
    Ген определяет уровень липопротеина(a): он задан от рождения и почти не меняется. Два частых варианта резко
    повышают его, а вместе с ним — риск ишемической болезни сердца и кальциноза аортального клапана.

- group: PCSK9
  section: Липиды и сердце
  title: PCSK9 — защитный вариант R46L
  about: >-
    PCSK9 разрушает рецепторы, которые убирают ЛПНП из крови. Вариант R46L его ослабляет: ЛПНП ниже с рождения,
    риск инфаркта заметно меньше. На этом же механизме работают современные лекарства от холестерина.

- group: APOB
  section: Липиды и сердце
  title: APOB — семейная гиперхолестеринемия
  about: >-
    Белок частиц ЛПНП. Вариант R3527Q мешает частице связаться с рецептором — ЛПНП высокий с детства.
    Это одна из причин семейной гиперхолестеринемии; остальные ищутся сверкой с ClinVar.

- group: SORT1
  section: Липиды и сердце
  title: SORT1 — уровень ЛПНП
  about: >-
    Локус 1p13: частый вариант усиливает работу гена в печени и немного снижает ЛПНП и риск ишемической болезни сердца.

- group: LDLR
  section: Липиды и сердце
  title: LDLR — уровень ЛПНП
  about: >-
    Рецептор, который убирает ЛПНП из крови. Частый вариант в начале гена немного снижает ЛПНП.
    Редкие «поломки» рецептора — причина семейной гиперхолестеринемии — ищутся сверкой с ClinVar.

- group: 9p21
  section: Липиды и сердце
  title: Локус 9p21 — ишемическая болезнь сердца
  about: >-
    Самый изученный частый вариант риска инфаркта. Действует независимо от холестерина и давления;
    каждая копия повышает риск примерно на четверть. Одна копия есть у половины европейцев.

- group: CETP
  section: Липиды и сердце
  title: CETP — уровень ЛПВП
  about: >-
    Белок, который переносит холестерин между частицами. Частый вариант снижает его активность и повышает ЛПВП.

- group: LIPC
  section: Липиды и сердце
  title: LIPC — уровень ЛПВП
  about: >-
    Печёночная липаза расщепляет жиры в частицах ЛПВП. Частый вариант снижает её активность — ЛПВП немного выше.

- group: APOA5
  section: Липиды и сердце
  title: APOA5 — триглицериды
  about: >-
    Белок, который помогает расщеплять триглицериды. Частый вариант повышает их уровень.

- group: 4q25
  section: Липиды и сердце
  title: Локус 4q25 — мерцательная аритмия
  about: >-
    Участок рядом с геном PITX2, который участвует в формировании левого предсердия. Самый сильный из частых
    вариантов риска мерцательной аритмии.

# ---------- Свёртывание ----------

- group: F5
  section: Свёртывание
  title: F5 — фактор V Лейден
  about: >-
    Самая частая наследственная причина венозных тромбозов. Одна копия повышает риск в несколько раз —
    особенно при долгой неподвижности, операциях и приёме гормонов.

- group: F2
  section: Свёртывание
  title: F2 — протромбин G20210A
  about: >-
    Вторая по частоте наследственная причина венозных тромбозов: вариант повышает уровень протромбина в крови.

- group: MTHFR
  section: Свёртывание
  title: MTHFR — фолатный цикл
  about: >-
    Фермент обмена фолата. Варианты C677T и A1298C есть у большинства людей и слегка снижают его активность.
    Вопреки популярным статьям, клинического значения они обычно не имеют; смотреть стоит на гомоцистеин в крови.

- group: ABO
  section: Свёртывание
  title: ABO — группа крови
  about: >-
    Ген группы крови. Группа O — это две копии варианта с делецией. При группе O ниже уровень фактора Виллебранда
    и риск тромбозов.

# ---------- Обмен веществ ----------

- group: TCF7L2
  section: Обмен веществ
  title: TCF7L2 — диабет 2 типа
  about: >-
    Самый сильный из частых вариантов риска диабета 2 типа: он ослабляет выброс инсулина в ответ на еду.
    Каждая копия повышает риск примерно в 1.4 раза.

- group: MTNR1B
  section: Обмен веществ
  title: MTNR1B — глюкоза натощак
  about: >-
    Рецептор мелатонина в клетках, вырабатывающих инсулин. Частый вариант повышает глюкозу натощак
    и немного — риск диабета 2 типа.

- group: G6PC2
  section: Обмен веществ
  title: G6PC2 — глюкоза натощак
  about: >-
    Фермент, который задаёт «точку срабатывания» выброса инсулина. Частый вариант чуть поднимает глюкозу
    натощак, но риск диабета при этом не растёт.

- group: FTO
  section: Обмен веществ
  title: FTO — вес
  about: >-
    Самый известный «ген веса»: каждая копия варианта прибавляет в среднем 1–1.5 кг, в основном через аппетит.
    Физическая активность заметно ослабляет его эффект.

- group: MC4R
  section: Обмен веществ
  title: MC4R — вес
  about: >-
    Рецептор, через который мозг получает сигнал сытости. Частый вариант рядом с геном немного повышает вес.

- group: GCKR
  section: Обмен веществ
  title: GCKR — глюкоза и триглицериды
  about: >-
    Регулятор фермента, который запускает переработку глюкозы в печени. Частый вариант одновременно снижает
    глюкозу натощак и повышает триглицериды и мочевую кислоту.

- group: ABCG2
  section: Обмен веществ
  title: ABCG2 — мочевая кислота и подагра
  about: >-
    Белок, который выводит мочевую кислоту через кишечник и почки. Вариант Q141K снижает его работу:
    мочевая кислота выше, риск подагры — тоже. Он же повышает уровень розувастатина в крови.

- group: SLC2A9
  section: Обмен веществ
  title: SLC2A9 — мочевая кислота
  about: >-
    Главный переносчик мочевой кислоты в почках. Частые варианты заметнее всех остальных генов сдвигают её уровень.

# ---------- Печень ----------

- group: PNPLA3
  section: Печень
  title: PNPLA3 — жировая болезнь печени
  about: >-
    Главный генетический фактор жировой болезни печени. Носители варианта I148M накапливают жир в печени
    охотнее, а алкоголь и лишний вес повреждают её у них заметно чаще.

- group: TM6SF2
  section: Печень
  title: TM6SF2 — жировая болезнь печени
  about: >-
    Белок, который помогает печени отдавать жир в кровь. При варианте E167K жир остаётся в печени:
    липиды в крови ниже, а риск жировой болезни печени выше.

- group: UGT1A1
  section: Печень
  title: UGT1A1 — билирубин и синдром Жильбера
  about: >-
    Фермент, который выводит билирубин. Две копии сниженного варианта — синдром Жильбера: билирубин слегка
    повышен, особенно натощак и при болезни; это безвредно. Этот же фермент выводит иринотекан и атазанавир.

# ---------- Витамины и питание ----------

- group: VITD
  section: Витамины и питание
  title: Витамин D — GC, CYP2R1, DHCR7
  about: >-
    Три гена, которые сильнее всего влияют на уровень витамина D в крови: его транспортный белок, фермент
    активации в печени и фермент синтеза в коже. Вместе они сдвигают уровень на несколько ng/mL.

- group: FUT2
  section: Витамины и питание
  title: FUT2 — «секретор»
  about: >-
    Ген решает, есть ли антигены группы крови в слюне и слизи кишечника. Каждый пятый европеец — «несекретор»:
    у таких людей выше витамин B12 и есть устойчивость к норовирусу, а кишечная щелочная фосфатаза в кровь
    после еды не попадает.

- group: FADS1
  section: Витамины и питание
  title: FADS1 — жирные кислоты омега-3 и омега-6
  about: >-
    Фермент, который превращает растительные жирные кислоты в длинные — арахидоновую и EPA.
    Частый вариант замедляет его: обеих кислот в крови меньше.

- group: LCT
  section: Витамины и питание
  title: LCT — усвоение лактозы
  about: >-
    У большинства людей мира фермент лактаза «выключается» после детства. Вариант рядом с геном оставляет его
    работать на всю жизнь; достаточно одной копии.

- group: HLA-DQ
  section: Витамины и питание
  title: HLA-DQ — целиакия
  about: >-
    Целиакия развивается почти только у носителей вариантов HLA-DQ2 или DQ8. Они есть у трети людей,
    и большинство из них здоровы — но без этих вариантов целиакия практически исключена.

- group: ALCOHOL
  section: Витамины и питание
  title: Алкоголь — ADH1B и ALDH2
  about: >-
    Два фермента распада алкоголя. «Быстрый» ADH1B и нерабочий ALDH2 делают выпивку неприятной: покраснение,
    сердцебиение, тошнота. Они часты в Восточной Азии и снижают риск алкогольной зависимости.

- group: CYP1A2
  section: Витамины и питание
  title: CYP1A2 — кофеин
  about: >-
    Фермент печени, который разрушает кофеин. При «медленном» варианте кофеин действует дольше.

# ---------- Гормоны и простата ----------

- group: PDE8B
  section: Гормоны и простата
  title: PDE8B — уровень ТТГ
  about: >-
    Фермент в клетках щитовидной железы. Частый вариант немного повышает ТТГ — в пределах нормы,
    без болезни щитовидной железы.

- group: SHBG
  section: Гормоны и простата
  title: SHBG — тестостерон и ГСПГ
  about: >-
    Ген белка, который связывает половые гормоны. Его варианты сдвигают уровень ГСПГ, а с ним — общий тестостерон.

- group: KLK3
  section: Гормоны и простата
  title: KLK3 — уровень ПСА
  about: >-
    Ген самого простат-специфического антигена. Его варианты меняют «личный» уровень ПСА на десятки процентов
    независимо от состояния простаты — это полезно учитывать при скрининге.

# ---------- Риски болезней ----------

- group: AMD
  section: Риски болезней
  title: Возрастная макулярная дегенерация — CFH и ARMS2
  about: >-
    Болезнь сетчатки в пожилом возрасте, главная причина потери центрального зрения. Два гена объясняют большую
    часть наследственного риска; из внешних факторов важнее всего курение.

- group: SERPINA1
  section: Риски болезней
  title: SERPINA1 — дефицит альфа-1-антитрипсина
  about: >-
    Белок, который защищает лёгкие от собственных ферментов. Две копии варианта Z (или Z вместе с S) —
    ранняя эмфизема, особенно у курящих, и болезнь печени.

- group: TTR
  section: Риски болезней
  title: TTR — транстиретиновый амилоидоз
  about: >-
    Варианты гена делают белок транстиретин неустойчивым: он откладывается в сердце и нервах.
    Проявляется после 50–60 лет; сегодня для него есть лечение.

- group: HLA-B27
  section: Риски болезней
  title: HLA-B27 — болезнь Бехтерева
  about: >-
    Вариант гена иммунной системы, который есть у большинства больных анкилозирующим спондилитом.
    Но и среди носителей заболевает лишь несколько процентов.

- group: MITF
  section: Риски болезней
  title: MITF — меланома
  about: >-
    Редкий вариант E318K гена, управляющего пигментными клетками, повышает риск меланомы в несколько раз.

- group: PTPN22
  section: Риски болезней
  title: PTPN22 — аутоиммунные болезни
  about: >-
    Ген-«тормоз» иммунных клеток. Вариант R620W ослабляет его и повышает риск сразу нескольких аутоиммунных
    болезней: диабета 1 типа, ревматоидного артрита, болезней щитовидной железы. Он есть у каждого шестого-десятого
    европейца, и большинство носителей здоровы.

# ---------- Нейродегенеративные болезни ----------

- group: APOE
  section: Нейродегенеративные болезни
  title: APOE — болезнь Альцгеймера и холестерин
  sensitive: true
  about: >-
    Ген белка, переносящего холестерин. У него три формы: ε3 — обычная, ε4 повышает риск поздней болезни
    Альцгеймера (одна копия — примерно втрое, две — на порядок) и немного ЛПНП, ε2 — снижает и то и другое.
    Это риск, а не приговор: многие носители ε4 не заболевают.

- group: TREM2
  section: Нейродегенеративные болезни
  title: TREM2 — болезнь Альцгеймера
  sensitive: true
  about: >-
    Редкий вариант R47H гена иммунных клеток мозга повышает риск болезни Альцгеймера примерно втрое.

- group: LRRK2
  section: Нейродегенеративные болезни
  title: LRRK2 — болезнь Паркинсона
  sensitive: true
  about: >-
    Вариант G2019S — самая частая наследственная причина болезни Паркинсона. К 80 годам заболевает
    от четверти до половины носителей.

- group: GBA1
  section: Нейродегенеративные болезни
  title: GBA1 — болезнь Паркинсона и болезнь Гоше
  sensitive: true
  about: >-
    Одна копия варианта повышает риск болезни Паркинсона в несколько раз; две копии — болезнь Гоше.

# ---------- Наследственный рак ----------

- group: BRCA
  section: Наследственный рак
  title: BRCA1 и BRCA2
  sensitive: true
  about: >-
    Гены починки ДНК. Их варианты резко повышают риск рака груди и яичников у женщин, рака простаты, груди
    и поджелудочной железы у мужчин. Чип видит три самых частых варианта и ещё часть известных — примерно
    каждый десятый; клинический тест читает гены целиком.

- group: MUTYH
  section: Наследственный рак
  title: MUTYH — полипоз кишечника
  sensitive: true
  about: >-
    Ген починки ДНК. Две копии вариантов — множественные полипы и высокий риск рака толстой кишки;
    одна копия — носительство, риск почти обычный.

- group: APC
  section: Наследственный рак
  title: APC — вариант I1307K
  sensitive: true
  about: >-
    Вариант, частый у евреев-ашкеназов, умеренно повышает риск рака толстой кишки. Тяжёлые варианты APC,
    вызывающие полипоз, — другие; они ищутся сверкой с ClinVar.

- group: CHEK2
  section: Наследственный рак
  title: CHEK2 — вариант I157T
  sensitive: true
  about: >-
    Ген контроля повреждений ДНК. Вариант I157T умеренно повышает риск нескольких опухолей;
    более сильный вариант 1100delC чип не видит.

# ---------- Носительство ----------

- group: CFTR
  section: Носительство
  title: CFTR — муковисцидоз
  sensitive: true
  about: >-
    Муковисцидоз возникает при двух вариантах гена — по одному от каждого родителя. Носитель одной копии здоров.
    F508del — самый частый вариант; остальные ищутся сверкой с ClinVar.

- group: HBB
  section: Носительство
  title: HBB — серповидноклеточная анемия
  sensitive: true
  about: >-
    Вариант гемоглобина S. Одна копия — носительство без болезни; две — серповидноклеточная анемия.

# ---------- Черты ----------

- group: HERC2
  section: Черты
  title: Цвет глаз — HERC2
  about: >-
    Участок, который управляет выработкой пигмента в радужке. Две копии «светлого» варианта обычно дают голубые
    или серые глаза.

- group: MC1R
  section: Черты
  title: MC1R — рыжие волосы и чувствительность к солнцу
  about: >-
    Рецептор, который переключает пигмент с рыжего на тёмный. Сильные варианты дают рыжие волосы, веснушки
    и кожу, которая легко сгорает; слабые — чуть более светлую кожу.

- group: ABCC11
  section: Черты
  title: ABCC11 — ушная сера
  about: >-
    Один вариант определяет, сухая ушная сера или влажная, и заодно — силу запаха пота.
    Сухой тип обычен в Восточной Азии и редок в Европе.

- group: ACTN3
  section: Черты
  title: ACTN3 — быстрые мышечные волокна
  about: >-
    Белок быстрых мышечных волокон. У каждого пятого его нет совсем — это не болезнь; среди спринтеров
    высокого уровня такие люди редки, среди бегунов на длинные дистанции — нет.

- group: TAS2R38
  section: Черты
  title: TAS2R38 — горький вкус
  about: >-
    Рецептор горечи. От его вариантов зависит, насколько горькими кажутся брокколи, брюссельская капуста
    и грейпфрут.

- group: COMT
  section: Черты
  title: COMT — вариант V158M
  about: >-
    Фермент, который разрушает дофамин в лобной коре. Популярные выводы о характере («воин» и «беспокойный»)
    крупными исследованиями не подтверждаются.

- group: CHRNA5
  section: Черты
  title: CHRNA5 — никотиновая зависимость
  about: >-
    Никотиновый рецептор. Курящие носители варианта выкуривают больше и бросают труднее;
    на некурящих он не влияет.

- group: OR2M7
  section: Черты
  title: Запах спаржи
  about: >-
    Вариант рядом с генами обонятельных рецепторов определяет, чувствует ли человек характерный запах мочи
    после спаржи.
