# Рассказы о гаплогруппах — общие знания, без чьих-либо данных.
# Сайт подбирает их к результату на странице «Геном», раздел «Происхождение».
#
#   y   отцовская линия. Рассказ привязан к маркерам ветви (snps): он показывается,
#       если у человека на пути от корня есть хотя бы один из них. Порядок — от общего к частному.
#   mt  материнская линия. Рассказ привязан к началу названия ветви (prefix): «H» подходит и к H, и к H1a.
#       Сверяются все ветви на пути от корня дерева, поэтому рассказ идёт от общего к частному.
#
# Даты приблизительные: разные исследования расходятся на тысячи лет.
# Гаплогруппа — это одна линия из тысяч предков, а не «происхождение человека» (docs/GENOME.md).

y:
  - name: A и B
    snps: [M31, M32, M60, M181]
    story: >-
      Самые древние ветви мужского древа. Почти все их носители живут в Африке к югу от Сахары — среди
      охотников-собирателей юга и центра континента они особенно часты. Остальное человечество — это боковые
      побеги более молодых ветвей.

  - name: CT — выход из Африки
    snps: [M168, M294, P9.1]
    story: >-
      Около 70–90 тысяч лет назад жил мужчина, от которого по прямой мужской линии происходят почти все мужчины
      за пределами Африки и большинство африканцев. Его потомки вышли из Африки и расселились по всем континентам.

  - name: C
    snps: [M130, M216]
    story: >-
      Одна из первых ветвей, ушедших на восток вдоль побережий. Сегодня часта у монголов, казахов, эвенков
      и коренных народов Австралии и Океании; её подветвь связывают с расселением монгольских народов.

  - name: D
    snps: [M174]
    story: >-
      Редкая древняя ветвь с двумя «островами» — Тибет и Японские острова, где её носят потомки древнего
      населения эпохи Дзёмон.

  - name: E
    snps: [M96, P29]
    story: >-
      Главная мужская ветвь Африки. Возникла около 60 тысяч лет назад; её носит большинство мужчин континента.

  - name: E1b1b
    snps: [M35, M35.1, M215]
    story: >-
      Ветвь из Северо-Восточной Африки, которая широко разошлась по Средиземноморью. Часта в Северной Африке,
      на Ближнем Востоке и на юге Европы.

  - name: E-V13
    snps: [V13]
    story: >-
      Европейская подветвь E1b1b. Сильнее всего представлена на Балканах — у албанцев, греков, сербов, —
      откуда в бронзовом и железном веке разошлась по Европе.

  - name: G
    snps: [M201]
    story: >-
      Ветвь первых земледельцев. Около 8 тысяч лет назад её носители принесли земледелие из Анатолии в Европу;
      «ледяной человек» Этци принадлежал к ней. Сегодня в Европе редка, а на Кавказе — одна из главных.

  - name: H
    snps: [M69, M2939]
    story: >-
      Ветвь Южной Азии: большинство носителей живёт в Индии. Одна из её подветвей часта у цыган — след
      их исхода из Индии около тысячи лет назад.

  - name: I — охотники Европы
    snps: [M170, P19]
    story: >-
      Единственная крупная ветвь, которая сложилась в самой Европе — около 25 тысяч лет назад, ещё до пика
      ледникового периода. Её носили европейские охотники-собиратели задолго до прихода земледельцев и степняков.

  - name: I1
    snps: [M253]
    story: >-
      «Скандинавская» ветвь. Почти все её носители происходят от одного мужчины, жившего около 4.5 тысячи лет
      назад; сегодня это до трети мужчин Швеции, Норвегии и Дании. По Европе её разнесли германские племена и викинги.

  - name: I2a — «динарская» ветвь
    snps: [P37.2, P37, CTS10228]
    story: >-
      Древняя европейская ветвь, одна из подветвей которой резко выросла около двух тысяч лет назад
      и разошлась вместе со славянами. Сегодня часта на Балканах — у боснийцев, хорватов, сербов —
      и заметна на Украине и в России.

  - name: I2a2
    snps: [M223, M436]
    story: >-
      Ветвь Северо-Западной Европы: Германия, Нидерланды, Британские острова, Скандинавия.
      Идёт от древних охотников-собирателей Западной Европы.

  - name: J
    snps: [M304, P209]
    story: >-
      Ветвь Ближнего Востока. Возникла около 40 тысяч лет назад между Кавказом, Анатолией и Месопотамией
      и разделилась на две большие части — J1 и J2.

  - name: J1
    snps: [M267]
    story: >-
      Ветвь Аравии и Кавказа. Главная мужская линия Аравийского полуострова, часта у народов Дагестана;
      с арабскими завоеваниями разошлась по Северной Африке.

  - name: J2
    snps: [M172]
    story: >-
      Ветвь Анатолии, Плодородного полумесяца и Средиземноморья. Расходилась с земледельцами, а позже —
      с мореплавателями бронзового века; часта в Турции, на Кавказе, в Греции, Италии, Иране.

  - name: N
    snps: [M231]
    story: >-
      Ветвь Северной Евразии. Возникла в Восточной Азии и за тысячи лет прошла через всю Сибирь на запад.

  - name: N1c — уральская ветвь
    snps: [M46, Tat, M178]
    story: >-
      Около трёх тысяч лет назад эта ветвь достигла Балтики. Сегодня она главная у финнов, эстонцев, латышей
      и литовцев, у якутов и многих народов Урала и Поволжья; на севере России — у каждого третьего-четвёртого мужчины.

  - name: O
    snps: [M175]
    story: >-
      Главная мужская ветвь Восточной и Юго-Восточной Азии: к ней относится большинство мужчин Китая, Кореи,
      Японии, Вьетнама и Индонезии.

  - name: Q
    snps: [M242]
    story: >-
      Сибирская ветвь. Около 15–20 тысяч лет назад её носители перешли в Америку: к ней принадлежит
      подавляющее большинство мужчин коренных народов обеих Америк. В Евразии часта у кетов и селькупов.

  - name: R
    snps: [M207, P224]
    story: >-
      Ветвь возникла около 30 тысяч лет назад в Северной Азии — к ней принадлежал мальчик со стоянки Мальта
      под Иркутском, живший 24 тысячи лет назад. Две её дочерние ветви, R1a и R1b, сегодня носит большинство мужчин Европы.

  - name: R1a
    snps: [M198, M17, M512, L62, M420]
    story: >-
      Степная ветвь. Около пяти тысяч лет назад её носители — скотоводы причерноморских степей — быстро
      расселились на запад и на восток. Сегодня это около половины мужчин в Польше, России, Белоруссии
      и на Украине и заметная доля в Индии, Иране и Средней Азии.

  - name: R1a-M417
    snps: [M417]
    story: >-
      Большая волна расселения R1a около пяти тысяч лет назад, которую связывают с культурой шнуровой керамики.
      От неё идут линии большинства славян и балтов, многих скандинавов и жителей Южной Азии.

  - name: R1a-Z280
    snps: [Z280, S466]
    story: >-
      Балто-славянская ветвь: самая частая у русских, белорусов, украинцев и литовцев.

  - name: R1a-M458
    snps: [M458]
    story: >-
      Западнославянская и центральноевропейская ветвь: Польша, Чехия, Словакия, восток Германии.

  - name: R1a-Z284
    snps: [Z284, S221]
    story: >-
      Скандинавская ветвь R1a: Норвегия, Швеция и места, куда доходили викинги.

  - name: R1a-Z93
    snps: [Z93, S202]
    story: >-
      Азиатская ветвь R1a. Её связывают с расселением индоиранских народов: Индия, Пакистан, Иран, Средняя Азия, Алтай.

  - name: R1b
    snps: [M343, PF6242]
    story: >-
      Самая частая мужская ветвь Западной Европы. Возникла около 20 тысяч лет назад; её разные подветви
      сегодня встречаются от Ирландии до Башкирии и Центральной Африки.

  - name: R1b-M269
    snps: [M269, PF6517]
    story: >-
      Около пяти-шести тысяч лет назад носители этой ветви — скотоводы ямной культуры из степей между Днепром
      и Уралом — начали одно из самых быстрых расселений в истории человечества. Сегодня к ней относится
      больше половины мужчин Западной Европы, а в Ирландии и Стране Басков — больше 80 %.

  - name: R1b-L151 — западноевропейский ствол
    snps: [L151, P310, L11, P311, L52]
    story: >-
      Ветвь, которая около 4.5–5 тысяч лет назад дала почти всё западноевропейское R1b. От неё идут две большие
      линии — U106 (север: Германия, Нидерланды, Скандинавия, Англия) и P312 (запад и юг: культура колоколовидных
      кубков, кельты, италики) — и несколько малых.

  - name: R1b-U106
    snps: [U106, S21, M405]
    story: >-
      «Северная» линия: побережье Северного моря, Нидерланды, север Германии, Дания, Англия.
      Её распространение связывают с германскими народами.

  - name: R1b-P312
    snps: [P312, S116]
    story: >-
      Линия культуры колоколовидных кубков, которая около 4.5 тысячи лет назад за несколько поколений заменила
      большую часть мужских линий Британии и Западной Европы. Главная у кельтских и романских народов.

  - name: R1b-S1194
    snps: [CTS4528, S1200, S1194, S14328]
    story: >-
      Малая сестринская линия U106 и P312 — третья ветвь западноевропейского ствола. Встречается нечасто,
      в основном на севере Европы: вокруг Балтики и Северного моря, в Скандинавии и на Британских островах.

  - name: T и L
    snps: [M184, M70, M20, M11]
    story: >-
      Редкие ветви с очагами на Ближнем Востоке, в Восточной Африке и Южной Азии.

mt:
  - name: L — африканские линии
    prefix: L
    story: >-
      Самые древние ветви материнского древа. Все они сложились в Африке; от одной из них — L3 — около
      60–70 тысяч лет назад пошли две линии, M и N, к которым относятся все люди за пределами Африки.

  - name: M
    prefix: M
    story: >-
      Одна из двух линий выхода из Африки. Ушла на восток: Южная Азия, Восточная Азия, Австралия.
      В Европе почти не встречается.

  - name: C, D, G, Z — Сибирь и Восточная Азия
    prefix: [C, D, G, Z]
    story: >-
      Ветви линии M, сложившиеся в Восточной Азии. C и D — в числе линий-основательниц коренного населения Америки;
      G и Z часты в Сибири и на Дальнем Востоке.

  - name: N
    prefix: N
    story: >-
      Вторая линия выхода из Африки. От неё происходят почти все материнские линии Западной Евразии.

  - name: A и B
    prefix: [A, B]
    story: >-
      Восточноазиатские ветви линии N. Обе — среди линий-основательниц коренных народов Америки;
      B к тому же разошлась по островам Тихого океана вплоть до Полинезии.

  - name: F
    prefix: F
    story: >-
      Ветвь Юго-Восточной Азии и Южного Китая.

  - name: I, W, X
    prefix: [I, W, X]
    story: >-
      Редкие ветви Западной Евразии — по несколько процентов в Европе и на Ближнем Востоке.
      Одна из подветвей X есть и у коренных народов Северной Америки.

  - name: R
    prefix: R
    story: >-
      Большая дочерняя линия N, сложившаяся вскоре после выхода из Африки. От неё идут H, V, J, T, U и K —
      то есть материнские линии подавляющего большинства европейцев.

  - name: HV
    prefix: HV
    story: >-
      Ближневосточная линия, от которой около 20–25 тысяч лет назад отделились H и V.

  - name: H — самая частая линия Европы
    prefix: H
    story: >-
      К ней принадлежит около 40 % европейцев. Возникла на Ближнем Востоке около 20–25 тысяч лет назад; её носители
      пережили пик ледникового периода в южных убежищах и после отступления льда заново заселили Европу. Позже линию
      пополнили земледельцы из Анатолии. Из-за того, что H очень частая, сама по себе она почти ничего не говорит
      о конкретном регионе — различаются её подветви.

  - name: H1 и H3
    prefix: [H1, H3]
    story: >-
      Подветви, которые после ледникового периода разошлись из убежища на юго-западе Европы.
      Особенно часты на Пиренейском полуострове и вдоль атлантического побережья.

  - name: V
    prefix: V
    story: >-
      Сестринская линия H. В целом редка, но часта у саамов Северной Скандинавии и у басков.

  - name: J и T — линии земледельцев
    prefix: [J, T]
    story: >-
      Пришли в Европу около 8 тысяч лет назад с первыми земледельцами из Анатолии и Ближнего Востока.
      Сегодня каждая из них — примерно у десятой части европейцев.

  - name: U — древнейшая линия Европы
    prefix: U
    story: >-
      Линия первых современных людей Европы: ей около 45–50 тысяч лет, и она найдена у древнейших европейцев.

  - name: U5
    prefix: U5
    story: >-
      Линия европейских охотников-собирателей. До прихода земледельцев к ней относилось большинство жителей Европы;
      сегодня — около 7–10 %, чаще на севере и востоке: у саамов, финнов, жителей Прибалтики и севера России.

  - name: U4
    prefix: U4
    story: >-
      Линия охотников Восточной Европы. Сегодня чаще всего встречается в Поволжье, на Урале и в Прибалтике.

  - name: U2 и U7
    prefix: [U2, U7]
    story: >-
      Ветви с южноазиатским уклоном: часты в Индии и Иране; одна из подветвей U2 издревле есть и в Европе.

  - name: U6
    prefix: U6
    story: >-
      Североафриканская ветвь: берберы, Канарские острова, юг Пиренейского полуострова.

  - name: K
    prefix: K
    story: >-
      Дочерняя ветвь U8, около десятой части европейцев. Широко разошлась с первыми земледельцами;
      к ней принадлежал «ледяной человек» Этци. Несколько её подветвей — среди главных материнских линий евреев-ашкеназов.
